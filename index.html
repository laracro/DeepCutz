<title>DeepCutz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a single record sleeve card centered in a narrow column; tracklist rail (A1–B3) above it, score in a catalog-number strip */
:root {
  --bg: #E9EBF1;
  --paper: #F8F8FB;
  --ink: #171C33;
  --muted: #5D6480;
  --line: #CDD1DE;
  --accent: #E0531C;
  --accent-ink: #FFFFFF;
  --hit: #8A93AD;
  --bside: #1C9C8C;
  --deep: #6A44D6;
  --grail: #C9921A;
  --miss: #C9CDD9;
  --groove: #1E2236;
  --f-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131D; --paper: #191D2B; --ink: #ECEEF6; --muted: #9AA1BC; --line: #2C3247;
    --accent: #FF6B33; --accent-ink: #1A0D06; --hit: #7C86A3; --bside: #2CC2AE; --deep: #9677FF; --grail: #E6B23A; --miss: #343A52; --groove: #05060A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131D; --paper: #191D2B; --ink: #ECEEF6; --muted: #9AA1BC; --line: #2C3247;
  --accent: #FF6B33; --accent-ink: #1A0D06; --hit: #7C86A3; --bside: #2CC2AE; --deep: #9677FF; --grail: #E6B23A; --miss: #343A52; --groove: #05060A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; align-items: center; gap: 14px; }
.disc {
  width: 52px; height: 52px; border-radius: 50%; flex: none; position: relative;
  background: repeating-radial-gradient(circle, var(--groove) 0 2px, color-mix(in srgb, var(--groove) 82%, var(--muted)) 2px 3px);
}
.disc::after { content: ""; position: absolute; inset: 34%; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--groove) inset; }
.disc.spin { animation: spin 1.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 2.1rem; line-height: 1; margin: 0; letter-spacing: -0.02em; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
.mode { margin-left: auto; display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode button { border: 0; background: none; color: var(--muted); font: 600 0.78rem var(--f-body); padding: 6px 10px; border-radius: 999px; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.strip { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.strip b { color: var(--ink); font-size: 1.05rem; font-variant-numeric: tabular-nums; }

.tracks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.trk { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 700 0.7rem var(--f-mono); color: var(--muted); }
.trk i { display: block; width: 100%; height: 8px; border-radius: 4px; background: var(--line); transition: background .3s; }
.trk.now { color: var(--ink); }
.trk.now i { background: var(--ink); }
.trk[data-t="hit"] i { background: var(--hit); } .trk[data-t="bside"] i { background: var(--bside); }
.trk[data-t="deep"] i { background: var(--deep); } .trk[data-t="grail"] i { background: var(--grail); } .trk[data-t="miss"] i { background: var(--miss); }
.tracks .side { grid-column: span 4; }

.sleeve { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.meta { display: flex; justify-content: space-between; gap: 12px; font: 700 0.74rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.meta .cat { color: var(--accent); }
.q { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 5.5vw, 2.2rem); line-height: 1.1; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.hint { margin: -8px 0 0; color: var(--muted); font-size: 0.92rem; }
form { display: flex; gap: 8px; flex-wrap: wrap; }
input[type=text] {
  flex: 1 1 220px; min-width: 0; font: 500 1.05rem var(--f-body); color: var(--ink); background: var(--bg);
  border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; outline: none;
}
input[type=text]:focus { border-color: var(--ink); }
.btn { font: 700 0.95rem var(--f-body); border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 2px solid transparent; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; border-color: var(--line); color: var(--muted); }
.btn:focus-visible, .mode button:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
.clock { font-family: var(--f-mono); font-size: 0.95rem; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.clock.low { color: var(--accent); }
.timebar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: -8px; }
.timebar .fill { height: 100%; background: var(--ink); transform-origin: left; transition: transform .2s linear, background .3s; }
.timebar .fill.low { background: var(--accent); }
.share { width: 100%; margin: 0; padding: 14px 16px; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px;
  font: 500 0.9rem/1.6 var(--f-mono); text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
.err { color: var(--accent); font-size: 0.9rem; min-height: 1.35em; margin: -10px 0 0; }

.result { display: flex; flex-direction: column; gap: 16px; }
.verdict { display: flex; align-items: center; gap: 16px; }
.badge { width: 76px; height: 76px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
  font: 800 1.35rem var(--f-display); box-shadow: 0 0 0 6px color-mix(in srgb, currentColor 0%, var(--paper)), 0 0 0 7px var(--line); }
.badge[data-t="hit"] { background: var(--hit); } .badge[data-t="bside"] { background: var(--bside); }
.badge[data-t="deep"] { background: var(--deep); } .badge[data-t="grail"] { background: var(--grail); } .badge[data-t="miss"] { background: var(--miss); color: var(--muted); }
.verdict h3 { margin: 0; font-family: var(--f-display); font-size: 1.4rem; line-height: 1.15; }
.verdict p { margin: 2px 0 0; color: var(--muted); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols h4 { margin: 0 0 6px; font: 700 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.cols ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.cols li { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; min-width: 0; }
.cols li span:first-child { overflow-wrap: anywhere; }
.cols li span:last-child { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cols li.you { font-weight: 700; color: var(--accent); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.final { text-align: center; align-items: center; }
.final .big { font: 800 4rem/1 var(--f-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.final .big small { font-size: 1.3rem; color: var(--muted); }
.rank { font: 700 0.8rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
.recap { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.recap div { display: grid; grid-template-columns: 2.4em 1fr auto; gap: 10px; align-items: baseline; font-size: 0.92rem; padding: 6px 0; border-bottom: 1px solid var(--line); }
.recap div > * { min-width: 0; overflow-wrap: anywhere; }
.recap .no { font: 700 0.75rem var(--f-mono); color: var(--muted); }
.recap .pts { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.recap em { font-style: normal; color: var(--muted); display: block; font-size: 0.8rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.toast { font-size: 0.85rem; color: var(--bside); min-height: 1.3em; margin: 0; }
footer { color: var(--muted); font-size: 0.8rem; text-align: center; }

@media (max-width: 440px) {
  .sleeve { padding: 18px; }
  .cols { grid-template-columns: 1fr; }
  .mode button { padding: 6px 8px; }
  .brand p { display: none; }
}
@media (prefers-reduced-motion: reduce) { .disc.spin { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="disc" id="disc" aria-hidden="true"></div>
    <div class="brand">
      <h1>Deep<span>Cutz</span></h1>
      <p>The music trivia game where rare answers win.</p>
    </div>
    <div class="mode" role="group" aria-label="Game mode">
      <button id="m-daily" aria-pressed="true">Daily</button>
      <button id="m-free" aria-pressed="false">Free dig</button>
    </div>
  </header>

  <div class="strip"><span id="catno">DCZ-0001</span><span>Score <b id="score">0</b> / 700</span></div>
  <div class="tracks" id="tracks"></div>

  <main class="sleeve" id="stage" aria-live="polite"></main>

  <div class="legend" aria-label="Rarity tiers">
    <span><i style="background:var(--hit)"></i>📻 Hit</span>
    <span><i style="background:var(--bside)"></i>💿 B-Side</span>
    <span><i style="background:var(--deep)"></i>🔥 Deep Cut</span>
    <span><i style="background:var(--grail)"></i>💎 Holy Grail</span>
    <span><i style="background:var(--miss)"></i>🔇 Dead wax</span>
  </div>
  <footer>One answer per track, 30 seconds on the clock. Any correct answer scores; the fewer diggers who'd name it, the more it's worth. Rarity figures are estimates.</footer>
</div>

// ---------- data prep ----------
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/&/g, " and ").replace(/^\s*(the|a|an)\s+/, "").replace(/[^a-z0-9]+/g, "");
CRATE.forEach(p => {
  p.answers = p.d.trim().split("\n").map(line => {
    const m = line.trim().match(/^([\d.]+)\s+(.*)$/);
    const [title, artist] = m[2].split(" ~ ");
    const names = title.split("|");
    return { w: +m[1], name: artist ? `${names[0]} · ${artist}` : names[0], keys: [...new Set(names.map(norm))] };
  });
  const total = p.answers.reduce((s, a) => s + a.w, 0);
  p.answers.forEach(a => { a.pct = a.w / total * 100; a.pts = points(a.pct); a.tier = tierOf(a.pts); });
  p.byPop = [...p.answers].sort((a, b) => b.pct - a.pct);
});
function points(pct) { return Math.max(5, Math.round(100 * (1 - Math.log(pct + 1) / Math.log(51)))); }
function tierOf(pts) { return pts >= 85 ? "grail" : pts >= 65 ? "deep" : pts >= 40 ? "bside" : "hit"; }
const TIER = { hit: "Hit", bside: "B-Side", deep: "Deep Cut", grail: "Holy Grail", miss: "Dead wax" };
const EMO = { hit: "📻", bside: "💿", deep: "🔥", grail: "💎", miss: "🔇" };
const LIMIT = 30; // seconds per track
let tick = null;
function stopTimer() { clearInterval(tick); tick = null; }
function startTimer(onExpire) {
  stopTimer();
  const upd = () => {
    const left = Math.max(0, game.deadline - Date.now()), s = Math.ceil(left / 1000);
    const c = $("clock"), b = $("bar"); if (!c) return stopTimer();
    c.textContent = "0:" + String(s).padStart(2, "0");
    c.classList.toggle("low", s <= 10); b.classList.toggle("low", s <= 10);
    b.style.transform = `scaleX(${left / (LIMIT * 1000)})`;
    if (left <= 0) { stopTimer(); onExpire(); }
  };
  upd(); tick = setInterval(upd, 200);
}

function lev(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function match(p, input) {
  const k = norm(input); if (!k) return null;
  for (const a of p.answers) if (a.keys.includes(k)) return a;
  let best = null, bd = 9;
  for (const a of p.answers) for (const key of a.keys) {
    const tol = key.length >= 10 ? 2 : key.length >= 5 ? 1 : 0;
    const d = lev(k, key); if (d <= tol && d < bd) { bd = d; best = a; }
  }
  return best;
}

// ---------- daily seed ----------
const EPOCH = Date.UTC(2026, 0, 1);
const now = new Date();
const dayNo = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - EPOCH) / 864e5) + 1;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pick7(r) {
  const idx = CRATE.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  // one question per category so every set mixes genres and eras
  const out = [], cats = new Set();
  for (const i of idx) { if (!cats.has(CRATE[i].cat)) { cats.add(CRATE[i].cat); out.push(i); } if (out.length === 7) break; }
  return out;
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const DKEY = "deepcutz-day-" + dayNo;

let game;
function newGame(mode) {
  if (mode === "daily") {
    const saved = store.get(DKEY);
    game = saved && saved.set ? saved : { mode, no: dayNo, set: pick7(rng(dayNo * 7919)), picks: [], i: 0, revealed: false };
  } else {
    game = { mode, no: null, set: pick7(rng(Date.now() & 0xffffffff)), picks: [], i: 0, revealed: false };
  }
  render();
}
const save = () => { if (game.mode === "daily") store.set(DKEY, game); };
const SLOT = ["A1", "A2", "A3", "A4", "B1", "B2", "B3"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtPct = p => p < 1 ? p.toFixed(1) + "%" : Math.round(p) + "%";
const total = () => game.picks.reduce((s, x) => s + x.pts, 0);

function render() {
  $("m-daily").setAttribute("aria-pressed", game.mode === "daily");
  $("m-free").setAttribute("aria-pressed", game.mode === "free");
  $("catno").textContent = game.mode === "daily" ? "DCZ-" + String(game.no).padStart(4, "0") + " · Daily" : "DCZ-FREE · Practice";
  $("score").textContent = total();
  $("tracks").innerHTML = SLOT.map((s, k) => {
    const pk = game.picks[k];
    return `<div class="trk ${k === game.i && !pk ? "now" : ""}" ${pk ? `data-t="${pk.tier}"` : ""}><i></i>${s}</div>`;
  }).join("");
  if (game.i >= 7) return renderFinal();
  const p = CRATE[game.set[game.i]];
  if (game.revealed) return renderReveal(p, game.picks[game.i]);
  $("stage").innerHTML = `
    <div class="meta"><span>Side ${SLOT[game.i][0]} · Track ${SLOT[game.i]} · <span class="cat">${p.cat}</span></span><span class="clock" id="clock" role="timer" aria-label="Time left">0:${LIMIT}</span></div>
    <div class="timebar"><div class="fill" id="bar"></div></div>
    <h2 class="q">${esc(p.q)}</h2>
    <p class="hint">One answer. Skip the obvious if you dare.</p>
    <form id="f" autocomplete="off">
      <input type="text" id="ans" placeholder="Your answer" aria-label="Your answer" autocomplete="off" spellcheck="false">
      <button class="btn primary" type="submit">Drop the needle</button>
    </form>
    <p class="err" id="err"></p>
    <div><button class="btn ghost" id="skip" type="button">Pass on this track</button></div>`;
  const inp = $("ans"); inp.focus({ preventScroll: true });
  let tries = 0;
  $("f").addEventListener("submit", e => {
    e.preventDefault();
    const v = inp.value.trim(); if (!v) { $("err").textContent = "Type an answer first."; return; }
    const a = match(p, v);
    if (!a) {
      tries++;
      if (tries < 2) { $("err").textContent = `"${v}" isn't in the crate. Check the spelling, or try once more.`; inp.select(); return; }
      return commit({ input: v, name: null, pct: 0, pts: 0, tier: "miss" });
    }
    commit({ input: v, name: a.name, pct: a.pct, pts: a.pts, tier: a.tier });
  });
  $("skip").addEventListener("click", () => commit({ input: "", name: null, pct: 0, pts: 0, tier: "miss" }));
  if (!game.deadline) { game.deadline = Date.now() + LIMIT * 1000; save(); }
  startTimer(() => {
    const v = inp.value.trim(), a = v && match(p, v);
    commit(a ? { input: v, name: a.name, pct: a.pct, pts: a.pts, tier: a.tier, timeout: true }
             : { input: v, name: null, pct: 0, pts: 0, tier: "miss", timeout: true });
  });
}

function commit(pick) {
  if (game.revealed) return;
  stopTimer();
  pick.secs = game.deadline ? Math.min(LIMIT, Math.max(0, Math.round((Date.now() - (game.deadline - LIMIT * 1000)) / 1000))) : LIMIT;
  game.deadline = null;
  $("disc").classList.add("spin");
  game.picks[game.i] = pick; game.revealed = true; save();
  setTimeout(() => { $("disc").classList.remove("spin"); render(); }, 550);
}

function renderReveal(p, pk) {
  const top = p.byPop.slice(0, 4), deep = p.byPop.slice(-4).reverse();
  const li = a => `<li class="${pk.name === a.name ? "you" : ""}"><span>${esc(a.name)}</span><span>${fmtPct(a.pct)}</span></li>`;
  const head = pk.name
    ? `<h3>${esc(pk.name)}</h3><p>${EMO[pk.tier]} ${TIER[pk.tier]} · named by about ${fmtPct(pk.pct)} of diggers${pk.timeout ? " · beat the buzzer" : ` · ${pk.secs}s`}</p>`
    : `<h3>${pk.timeout && !pk.input ? "Time's up" : pk.input ? `"${esc(pk.input)}" missed` : "Passed"}</h3><p>${EMO.miss} Dead wax. No points on this track.</p>`;
  $("stage").innerHTML = `
    <div class="meta"><span>Track ${SLOT[game.i]}</span><span class="cat">${p.cat}</span></div>
    <div class="result">
      <p class="hint" style="margin:0">${esc(p.q)}</p>
      <div class="verdict"><div class="badge" data-t="${pk.tier}">+${pk.pts}</div><div>${head}</div></div>
      <div class="cols">
        <div><h4>Most named</h4><ol>${top.map(li).join("")}</ol></div>
        <div><h4>Deepest in the crate</h4><ol>${deep.map(li).join("")}</ol></div>
      </div>
      <p class="hint" style="margin:0">${p.answers.length} answers in this crate.</p>
      <div><button class="btn primary" id="next" type="button">${game.i === 6 ? "See your record" : "Next track"}</button></div>
    </div>`;
  $("next").focus({ preventScroll: true });
  $("next").addEventListener("click", () => { game.i++; game.revealed = false; save(); render(); });
}

function rankOf(t) { return t >= 520 ? "Crate legend" : t >= 400 ? "Record collector" : t >= 280 ? "Liner-note reader" : t >= 150 ? "Radio regular" : "Top 40 tourist"; }
const RANK_EMO = { "Crate legend": "👑", "Record collector": "🏆", "Liner-note reader": "📖", "Radio regular": "🎙️", "Top 40 tourist": "🧳" };
function shareText(t) {
  const row = a => a.map(x => EMO[x.tier]).join("");
  let streak = 0, run = 0;
  game.picks.forEach(x => { run = (x.tier === "deep" || x.tier === "grail") ? run + 1 : 0; streak = Math.max(streak, run); });
  const secs = game.picks.reduce((s, x) => s + (x.secs || 0), 0);
  const grails = game.picks.filter(x => x.tier === "grail").length;
  return `🎧 DeepCutz ${game.mode === "daily" ? "#" + game.no : "free dig"} · ${t}/700\n${row(game.picks)}`;
}
function renderFinal() {
  const t = total();
  const share = shareText(t);
  $("stage").classList.add("final");
  $("stage").innerHTML = `
    <div class="rank">${rankOf(t)}</div>
    <div class="big">${t}<small> / 700</small></div>
    <div class="recap">${game.picks.map((x, k) => {
      const p = CRATE[game.set[k]];
      return `<div><span class="no">${SLOT[k]}</span><span>${x.name ? esc(x.name) : "<span style='color:var(--muted)'>No answer</span>"}<em>${esc(p.q)}</em></span><span class="pts">+${x.pts}</span></div>`;
    }).join("")}</div>
    <pre class="share" aria-label="Shareable result">${esc(share)}</pre>
    <div class="row">
      <button class="btn primary" id="copy" type="button">Copy result</button>
      <button class="btn ghost" id="again" type="button">Free dig</button>
    </div>
    <p class="toast" id="toast">${game.mode === "daily" ? "A new daily crate drops at midnight." : ""}</p>`;
  $("copy").addEventListener("click", () => {
    const done = () => $("toast").textContent = "Copied. Paste it in your group chat.";
    try { navigator.clipboard.writeText(share).then(done, () => $("toast").textContent = share); } catch { $("toast").textContent = share; }
  });
  $("again").addEventListener("click", () => newGame("free"));
}
const _render = render;
render = function () { stopTimer(); $("stage").classList.remove("final"); _render(); };

$("m-daily").addEventListener("click", () => newGame("daily"));
$("m-free").addEventListener("click", () => newGame("free"));
newGame("daily");
</script>
